server:
  port: 8080

spring:
  application:
    name: DisasterEye

  datasource:
    url: jdbc:h2:mem:disastereyedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

nasa:
  api:
    key: DEMO_KEY
    base-url: https://eonet.gsfc.nasa.gov/api/v3
    firms-url: https://firms.modaps.eosdis.nasa.gov/api/area/csv

security:
  jwt:
    secret: disastereye-super-secret-key-fiap-2026-ods9-space-api
    expiration: 86400000 # 24h em ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    app:
      enabled: true

info:
  app:
    name: DisasterEye
    description: Plataforma de prevenção de desastres naturais via satélites NASA
    version: 1.0.0
    ods: ODS 9 - Indústria, Inovação e Infraestrutura

logging:
  level:
    root: INFO
    br.com.fiap.disastereye: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [traceId=%X{traceId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [traceId=%X{traceId}] %logger{36} - %msg%n"
  file:
    name: logs/disastereye.log
